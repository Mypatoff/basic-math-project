{{define "content"}}
<div id="start-screen" class="screen">
	<h1>Practice</h1>
	<p>Pick a difficulty to start a 10-question lesson.</p>
	<div class="chip-row">
		<button type="button" class="chip" data-difficulty="1">1</button>
		<button type="button" class="chip" data-difficulty="2">2</button>
		<button type="button" class="chip" data-difficulty="3">3</button>
	</div>
</div>

<div id="lesson-screen" class="screen hidden">
	<div class="lesson-topbar">
		<button type="button" id="back-btn" class="icon-btn" aria-label="Back to difficulty picker">&larr;</button>
		<div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
	</div>

	<div class="lesson-body">
		<p id="question" class="question"></p>
		<input type="number" id="answer-input" class="big-input" inputmode="numeric" autocomplete="off">
		<p id="lesson-error" class="error"></p>
	</div>

	<div class="lesson-footer">
		<button type="button" id="check-btn" class="btn btn-primary">CHECK</button>
	</div>

	<div id="feedback-panel" class="feedback-panel">
		<p id="feedback-text" class="feedback-text"></p>
		<button type="button" id="continue-btn" class="btn btn-primary">CONTINUE</button>
	</div>
</div>

<div id="complete-screen" class="screen hidden">
	<h1>Lesson complete!</h1>
	<p id="score-text" class="score-text"></p>
	<button type="button" id="again-btn" class="btn btn-primary">Practice again</button>
</div>
{{end}}
