{{define "layout.html"}}<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{.Title}} - MathPath</title>
	<link rel="stylesheet" href="/static/style.css">
</head>
<body>
	<div class="app">
		{{if not .HideNav}}
		<header class="navbar">
			<a href="/" class="brand">MathPath</a>
			<nav>
				{{if .LoggedIn}}
				<a href="/">Levels</a>
				<a href="/account">Account</a>
				{{else}}
				<a href="/login">Login</a>
				<a href="/register">Register</a>
				{{end}}
			</nav>
		</header>
		{{end}}

		{{template "content" .}}

		{{if not .HideNav}}
		<footer class="site-footer">
			<p>MathPath &mdash; practice a little every day.</p>
		</footer>
		{{end}}
	</div>
	<script src="/static/app.js" defer></script>
</body>
</html>
{{end}}
