{{define "content"}}
<div id="lesson-root" class="lesson-page" data-level-id="{{.LevelID}}">
	<div class="lesson-topbar">
		<a href="/" class="icon-btn" aria-label="Back to levels">&larr;</a>
		<div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
	</div>

	<div id="lesson-screen" class="screen">
		<p id="question" class="question"></p>
		<input type="number" id="answer-input" class="big-input" inputmode="numeric" autocomplete="off">
		<p id="lesson-error" class="error"></p>
	</div>

	<div class="lesson-footer">
		<button type="button" id="check-btn" class="btn btn-primary">CHECK</button>
	</div>

	<div id="feedback-panel" class="feedback-panel">
		<p id="feedback-text" class="feedback-text"></p>
		<button type="button" id="continue-btn" class="btn btn-primary">CONTINUE</button>
	</div>

	<div id="end-screen" class="screen hidden">
		<h1 id="end-title"></h1>
		<p id="end-score" class="score-text"></p>
		<p id="end-message"></p>
		<button type="button" id="retry-btn" class="btn btn-primary">Try again</button>
		<a href="/" class="btn btn-secondary">Back to levels</a>
	</div>
</div>
{{end}}
